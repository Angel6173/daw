<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Correo Electrónico</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{% if user.status %}Activo{% else %}Inactivo{% endif %}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No hay usuarios activos registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
