<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Curso</th>
                <th>Créditos</th>
            </tr>
        </thead>
        <tbody>
            {% for course in courses %}
            <tr>
                <td>{{ course.coursename }}</td>
                <td>{{ course.credits }} crt.</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2">No hay cursos disponibles.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
